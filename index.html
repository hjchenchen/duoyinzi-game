<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國語文多音字配對遊戲</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  padding: 16px;
}
.card {
  background: white; border-radius: 20px; padding: 32px 24px;
  max-width: 520px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
}
h1 { font-size: 26px; color: #4a1d6e; margin-bottom: 6px; }
.subtitle { font-size: 14px; color: #888; margin-bottom: 24px; }
.input-group { margin-bottom: 16px; text-align: left; }
.input-group label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; font-weight: bold; }
.input-group input {
  width: 100%; padding: 12px 16px; border: 2px solid #ddd;
  border-radius: 10px; font-size: 18px; text-align: center; transition: border-color 0.2s;
}
.input-group input:focus { outline: none; border-color: #667eea; }
.btn {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  font-size: 18px; font-weight: bold; cursor: pointer;
  transition: transform 0.1s, box-shadow 0.2s;
  color: white; background: linear-gradient(135deg, #667eea, #764ba2);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.option-btn {
  width: 100%; padding: 16px; margin: 6px 0; border: 3px solid #e0e0e0;
  border-radius: 12px; font-size: 28px; background: #fafafa;
  cursor: pointer; transition: all 0.15s; color: #333;
}
.option-btn:hover { border-color: #667eea; background: #f0f0ff; }
.option-btn:disabled { opacity: 0.7; cursor: not-allowed; }
.option-btn.correct { border-color: #4caf50; background: #e8f5e9; color: #2e7d32; }
.option-btn.wrong { border-color: #f44336; background: #ffebee; color: #c62828; }
.sentence { font-size: 20px; color: #444; margin: 12px 0 16px; line-height: 1.8; }
.highlight { color: #e53935; font-weight: bold; font-size: 110%; }
.timer-bar {
  width: 100%; height: 8px; background: #e0e0e0;
  border-radius: 4px; margin-bottom: 12px; overflow: hidden;
}
.timer-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, #4caf50, #ff9800, #f44336);
  transition: width 1s linear;
}
.progress { font-size: 14px; color: #999; margin-bottom: 6px; }
.result-icon { font-size: 64px; margin-bottom: 8px; }
.result-score { font-size: 48px; font-weight: bold; color: #4a1d6e; }
.result-text { font-size: 18px; color: #666; margin: 8px 0 24px; }
.status-msg { margin-top: 12px; font-size: 14px; padding: 8px; border-radius: 8px; }
.status-msg.success { background: #e8f5e9; color: #2e7d32; }
.status-msg.error { background: #ffebee; color: #c62828; }
.footer { margin-top: 16px; font-size: 12px; color: #aaa; }
.hint-btn {
  background: linear-gradient(135deg, #ff9800, #f57c00);
  color: white; border: none; border-radius: 8px;
  padding: 6px 14px; font-size: 13px; cursor: pointer;
  margin-top: 4px; transition: transform 0.1s;
}
.hint-btn:hover { transform: scale(1.05); }
.hint-btn:disabled { opacity: 0.5; transform: none; }
.ai-feedback {
  margin-top: 12px; padding: 14px; border-radius: 12px;
  text-align: left; font-size: 15px; line-height: 1.7;
  animation: fadeIn 0.3s;
}
.ai-feedback.correct { background: #e8f5e9; border-left: 4px solid #4caf50; }
.ai-feedback.wrong { background: #fff3e0; border-left: 4px solid #ff9800; }
.ai-feedback .ai-label { font-size: 12px; color: #999; margin-bottom: 6px; }
.ai-box {
  margin: 20px 0; padding: 16px; border-radius: 12px;
  background: linear-gradient(135deg, #f3e5f5 0%, #e8eaf6 100%);
  border: 2px solid #ce93d8; text-align: left;
}
.ai-box h3 { font-size: 14px; color: #7b1fa2; margin-bottom: 8px; }
.ai-box p { font-size: 15px; color: #333; line-height: 1.8; }
.ai-loading {
  display: flex; align-items: center; gap: 8px;
  color: #999; font-size: 13px; padding: 8px 0;
}
.spinner {
  width: 16px; height: 16px; border: 2px solid #ddd;
  border-top-color: #667eea; border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="card" id="app">
  <div id="screen-start">遊戲載入中...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
<script>
  var SUPABASE_URL = 'https://gedmvhclerscqdvjmqrc.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlZG12aGNsZXJzY3FkdmptcXJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzgwMjIsImV4cCI6MjEwMDkxNDAyMn0.-StkBfmWnJLgFfaxJEx2bnjrx9rVZmZw5uZYsaPGRx8';
  var AI_PROXY = 'https://gedmvhclerscqdvjmqrc.supabase.co/functions/v1/ai-proxy';

  function getSupabase() {
    if (window.supabase && window.supabase.createClient) {
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    return null;
  }

  function shuffle(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = b[i]; b[i] = b[j]; b[j] = t;
    }
    return b;
  }

  function askAI(msgs) {
    return new Promise(function(resolve, reject) {
      var timedOut = false;
      var timer = setTimeout(function() {
        timedOut = true;
        reject(new Error('AI 回應超時（6秒）'));
      }, 6000);

      fetch(AI_PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: msgs })
      }).then(function(r) {
        clearTimeout(timer);
        if (timedOut) return;
        if (!r.ok) throw new Error('API 錯誤 ' + r.status);
        return r.json();
      }).then(function(data) {
        if (timedOut) return;
        resolve(data.content || '');
      }).catch(function(e) {
        clearTimeout(timer);
        if (timedOut) return;
        console.error('[AI] 請求失敗:', e);
        reject(e);
      });
    });
  }

  var ALL_Q = [
    { c: '長', s: '這是一條很<span class="highlight">長</span>的路。', a: 'ㄔㄤˊ', p: '這是一條很長的路。', o: ['ㄔㄤˊ', 'ㄓㄤˇ'] },
    { c: '長', s: '小美<span class="highlight">長</span>高了很多。', a: 'ㄓㄤˇ', p: '小美長高了很多。', o: ['ㄔㄤˊ', 'ㄓㄤˇ'] },
    { c: '樂', s: '我們一起欣賞<span class="highlight">音</span>樂表演。', a: 'ㄩㄝˋ', p: '我們一起欣賞音樂表演。', o: ['ㄌㄜˋ', 'ㄩㄝˋ'] },
    { c: '樂', s: '祝你生日快<span class="highlight">樂</span>！', a: 'ㄌㄜˋ', p: '祝你生日快樂！', o: ['ㄌㄜˋ', 'ㄩㄝˋ'] },
    { c: '重', s: '這個書包非常<span class="highlight">重</span>。', a: 'ㄓㄨㄥˋ', p: '這個書包非常重。', o: ['ㄓㄨㄥˋ', 'ㄔㄨㄥˊ'] },
    { c: '重', s: '請你再<span class="highlight">重</span>說一次。', a: 'ㄔㄨㄥˊ', p: '請你再重說一次。', o: ['ㄓㄨㄥˋ', 'ㄔㄨㄥˊ'] },
    { c: '行', s: '郵局在第二條<span class="highlight">銀</span>行的旁邊。', a: 'ㄏㄤˊ', p: '郵局在第二條銀行的旁邊。', o: ['ㄒㄧㄥˊ', 'ㄏㄤˊ'] },
    { c: '行', s: '週末我們去山上<span class="highlight">旅</span>行。', a: 'ㄒㄧㄥˊ', p: '週末我們去山上旅行。', o: ['ㄒㄧㄥˊ', 'ㄏㄤˊ'] },
    { c: '數', s: '弟弟會從一<span class="highlight">數</span>到一百。', a: 'ㄕㄨˇ', p: '弟弟會從一數到一百。', o: ['ㄕㄨˇ', 'ㄕㄨˋ'] },
    { c: '數', s: '我喜歡上<span class="highlight">數</span>學課。', a: 'ㄕㄨˋ', p: '我喜歡上數學課。', o: ['ㄕㄨˇ', 'ㄕㄨˋ'] },
    { c: '傳', s: '請你幫我<span class="highlight">傳</span>話給老師。', a: 'ㄔㄨㄢˊ', p: '請你幫我傳話給老師。', o: ['ㄔㄨㄢˊ', 'ㄓㄨㄢˋ'] },
    { c: '傳', s: '水滸<span class="highlight">傳</span>是四大名著之一。', a: 'ㄓㄨㄢˋ', p: '水滸傳是四大名著之一。', o: ['ㄔㄨㄢˊ', 'ㄓㄨㄢˋ'] }
  ];

  var QS = shuffle(ALL_Q.slice());

  var st = { seat: '', qi: 0, sc: 0, t0: 0, t1: 0, ti: null, an: false, sb: false, hu: false };
  var app = document.getElementById('app');

  function rss() {
    st.sb = false;
    QS = shuffle(ALL_Q.slice());
    app.innerHTML = '<h1>🤖 AI 多音字配對遊戲</h1>' +
      '<p class="subtitle">AI 老師陪你學多音字！選出紅字的正確注音</p>' +
      '<div class="input-group"><label for="sn">請輸入你的班級座號</label>' +
      '<input type="number" id="sn" min="1" max="99" placeholder="例如：12" autofocus></div>' +
      '<button class="btn" id="bs">🚀 開始遊戲（共 ' + QS.length + ' 題）</button>' +
      '<p class="footer">AI 老師會陪你學習 · 資料儲存到雲端</p>';
    var si = document.getElementById('sn');
    document.getElementById('bs').addEventListener('click', ts);
    si.addEventListener('keydown', function(e) { if (e.key === 'Enter') ts(); else si.style.borderColor = '#ddd'; });
    function ts() {
      var v = parseInt(si.value, 10);
      if (v >= 1 && v <= 99) { st.seat = v; rgs(); }
      else { si.style.borderColor = '#f44336'; si.focus(); }
    }
  }

  function rgs() { st.qi = 0; st.sc = 0; st.t0 = Date.now(); st.an = false; rq(); }

  function rq() {
    if (st.qi >= QS.length) { rrs(); return; }
    st.hu = false;
    var q = QS[st.qi];
    app.innerHTML = '<p class="progress">第 ' + (st.qi + 1) + ' / ' + QS.length + ' 題</p>' +
      '<div class="timer-bar"><div class="timer-fill" id="tf" style="width:100%"></div></div>' +
      '<div class="sentence">' + q.s + '</div>' +
      '<p style="font-size:14px;color:#999;">這個紅字的正確注音是？</p>' +
      '<button class="hint-btn" id="bh">💡 AI 提示</button>' +
      '<div id="oc"></div><div id="af"></div>';

    var ct = document.getElementById('oc');
    var tf = document.getElementById('tf');
    var start = Date.now();

    for (var idx = 0; idx < q.o.length; idx++) {
      (function(opt) {
        var b = document.createElement('button');
        b.className = 'option-btn'; b.textContent = opt;
        b.addEventListener('click', function() { ha(opt, q, start); });
        ct.appendChild(b);
      })(q.o[idx]);
    }

    document.getElementById('bh').addEventListener('click', function() { rh(q); });

    var ti = setInterval(function() {
      var e = Date.now() - start;
      tf.style.width = Math.max(0, 100 - (e / 10000) * 100) + '%';
      if (e >= 10000) { clearInterval(ti); ht(q); }
    }, 200);
    st.ti = ti;
  }

  function da() {
    var btns = document.querySelectorAll('.option-btn, .hint-btn');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
  }

  function ha(sel, q, start) {
    if (st.an) return;
    st.an = true; clearInterval(st.ti); da();
    var ok = sel === q.a;
    if (ok) st.sc++;
    var allBtns = document.querySelectorAll('.option-btn');
    for (var i = 0; i < allBtns.length; i++) {
      if (allBtns[i].textContent === q.a) allBtns[i].classList.add('correct');
      if (allBtns[i].textContent === sel && !ok) allBtns[i].classList.add('wrong');
    }
    var fd = document.getElementById('af');
    fd.innerHTML = '<div class="ai-loading"><div class="spinner"></div>🤖 AI 老師解析中...</div>';
    saf(q, ok, sel).then(function(h) {
      fd.innerHTML = h;
    }).catch(function(e) {
      console.error('[AI] 解析失敗:', e);
      fd.innerHTML = '<div class="ai-feedback wrong"><div class="ai-label">🤖 AI 老師</div>AI 老師暫時無法回應（' + e.message + '），我們繼續下一題吧！</div>';
    });
    setTimeout(function() { st.qi++; st.an = false; rq(); }, 8000);
  }

  function ht(q) {
    if (st.an) return;
    st.an = true; clearInterval(st.ti); da();
    var allBtns = document.querySelectorAll('.option-btn');
    for (var i = 0; i < allBtns.length; i++) {
      if (allBtns[i].textContent === q.a) allBtns[i].classList.add('correct');
    }
    var fd = document.getElementById('af');
    fd.innerHTML = '<div class="ai-loading"><div class="spinner"></div>🤖 AI 老師解析中...</div>';
    saf(q, false, '(未作答)').then(function(h) {
      fd.innerHTML = h;
    }).catch(function(e) {
      console.error('[AI] 解析失敗:', e);
      fd.innerHTML = '<div class="ai-feedback wrong"><div class="ai-label">🤖 AI 老師</div>時間到！正確答案是「' + q.a + '」。繼續加油！</div>';
    });
    setTimeout(function() { st.qi++; st.an = false; rq(); }, 8000);
  }

  function saf(q, ok, sel) {
    return new Promise(function(resolve, reject) {
      var m = ok
        ? '學生答對了。題目：「' + q.p + '」，正確注音符號是「' + q.a + '」。請給一個幫助記憶的可愛小口訣（15字以內）。'
        : '學生答錯了。題目：「' + q.p + '」，正確注音符號是「' + q.a + '」，學生選了「' + sel + '」。請用國小四年級能懂的話，先簡短說明為什麼（1句），再給一個記憶小口訣（15字以內）。總共不超過60字。';
      askAI([
        { role: 'system', content: '你是國小四年級的溫柔老師，教多音字。用簡單溫暖鼓勵的語氣，使用繁體中文。' },
        { role: 'user', content: m }
      ]).then(function(c) {
        var cls = ok ? 'correct' : 'wrong';
        resolve('<div class="ai-feedback ' + cls + '"><div class="ai-label">🤖 AI 老師說：</div>' + c.replace(/\n/g, '<br>') + '</div>');
      }).catch(function(e) { reject(e); });
    });
  }

  function rh(q) {
    var b = document.getElementById('bh');
    if (st.hu || !b) return;
    st.hu = true; b.textContent = '⏳ AI 思考中...'; b.disabled = true;
    askAI([
      { role: 'system', content: '你是國小四年級的老師。學生在做多音字練習需要提示，但不能說答案。1句話引導，使用繁體中文。' },
      { role: 'user', content: '題目：「' + q.p + '」。請給一個提示引導學生想到正確注音符號，不要說出答案。' }
    ]).then(function(c) {
      b.textContent = '💡 ' + c.substring(0, 30);
    }).catch(function(e) {
      console.error('[AI] 提示失敗:', e);
      b.textContent = '💡 提示：想想這個詞平常怎麼念～';
    });
  }

  function rrs() {
    st.t1 = Date.now();
    var ts = Math.round((st.t1 - st.t0) / 1000);
    var pct = Math.round((st.sc / QS.length) * 100);
    var ic, mg;
    if (pct >= 90) { ic = '🏆'; mg = '太厲害了！幾乎全對！'; }
    else if (pct >= 70) { ic = '🌟'; mg = '表現不錯！再加強一下！'; }
    else if (pct >= 50) { ic = '💪'; mg = '加油！多練習就會進步！'; }
    else { ic = '📚'; mg = '多音字要多多練習喔！'; }

    app.innerHTML = '<div class="result-icon">' + ic + '</div>' +
      '<p class="subtitle">' + mg + '</p>' +
      '<div class="result-score">' + st.sc + ' / ' + QS.length + '</div>' +
      '<p class="result-text">正確率 ' + pct + '%</p>' +
      '<p class="result-text" style="font-size:14px;">⏱ 花了 ' + ts + ' 秒</p>' +
      '<p class="result-text" style="font-size:14px;">🪑 座號：' + st.seat + '</p>' +
      '<div id="ae"><div class="ai-loading"><div class="spinner"></div>🤖 AI 老師正在寫鼓勵的話...</div></div>' +
      '<button class="btn" id="bsb" style="margin-top:12px;">📤 上傳成績</button>' +
      '<button class="btn" id="br" style="margin-top:8px;background:#888;">🔄 再玩一次</button>' +
      '<div id="ss" class="status-msg" style="display:none;"></div>';

    re(pct, ts);

    document.getElementById('bsb').addEventListener('click', function() {
      var btn = this, sts = document.getElementById('ss');
      var sb = getSupabase();
      if (!sb) { sts.style.display = 'block'; sts.className = 'status-msg error'; sts.textContent = '❌ Supabase 尚未載入，請稍候再試'; btn.disabled = false; return; }
      btn.disabled = true; btn.textContent = '上傳中...';
      sb.from('game_scores').insert({ seat_number: st.seat, score: st.sc, total_questions: QS.length, time_seconds: ts })
        .then(function(r) {
          if (r.error) throw r.error;
          sts.style.display = 'block'; sts.className = 'status-msg success';
          sts.textContent = '✅ 成績已成功上傳到雲端！';
          st.sb = true; btn.textContent = '✅ 已上傳';
        }).catch(function(err) {
          sts.style.display = 'block'; sts.className = 'status-msg error';
          sts.textContent = '❌ 上傳失敗：' + err.message;
          btn.disabled = false; btn.textContent = '📤 重試上傳';
        });
    });

    document.getElementById('br').addEventListener('click', function() {
      if (st.sb || confirm('尚未上傳成績，確定要離開嗎？')) rss();
    });
  }

  function re(pct, ts) {
    var lv = pct >= 80 ? '高分' : pct >= 50 ? '中等' : '需要加油';
    askAI([
      { role: 'system', content: '你是國小四年級的溫柔老師。請給學生一段鼓勵的話，語氣像在對孩子說話一樣溫暖。40字以內，使用繁體中文。' },
      { role: 'user', content: '學生答對 ' + st.sc + '/' + QS.length + ' 題（正確率' + pct + '%），花了' + ts + '秒。程度：' + lv + '。' }
    ]).then(function(c) {
      document.getElementById('ae').innerHTML = '<div class="ai-box"><h3>🤖 AI 老師的話</h3><p>' + c + '</p></div>';
    }).catch(function(e) {
      console.error('[AI] 鼓勵失敗:', e);
      document.getElementById('ae').innerHTML = '<div class="ai-box"><h3>🤖 AI 老師的話</h3><p>你很棒！每一次練習都在進步，繼續加油喔！🌟</p></div>';
    });
  }

  rss();
</script>
</body>
</html>
